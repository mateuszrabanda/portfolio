<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghosts · Mateusz Rabanda</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="A small collection of handmade ghosts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=25">
  <script src="common.js?v=25" defer></script>
  <script src="ghosts.js?v=25" defer></script>
</head>
<body>
  <div class="page">
    <div class="col">
      <header class="top">
        <a class="back" href="./"><img src="assets/arrow-left.svg" alt="" width="16" height="16"> go back</a>
        <nav class="links" aria-label="Social">
          <a href="mailto:contact@rabanda.com" data-copy="contact@rabanda.com">email</a>
          <a href="https://www.linkedin.com/in/rabanda/" target="_blank" rel="noopener">linkedin</a>
          <a href="https://x.com/mateusz_rabanda" target="_blank" rel="noopener">x</a>
        </nav>
      </header>

      <main>
        <section class="block">
          <h2 class="label">note</h2>
          <p>collecting handmade ghosts has long been a quiet delight. each below is unique, with a spirit of its own - human crafted in small batches</p>
        </section>

        <section class="block">
          <h2 class="label">museum</h2>
          <!-- Each ghost: data-name, data-batch, data-acquired fill the hover tag.
               A ghost without data-name is a grey placeholder for the next one. -->
          <ul class="museum">
            <li class="ghost" tabindex="0" data-name="finial ghost of ms. bet" data-batch="146 worldwide" data-acquired="acquired in 2026">
              <img class="ghost-img" src="assets/ghosts/ms-bet-finial.webp" alt="Finial Ghost of Ms Bet: cardinal red and black, with a dark reaching figure" draggable="false">
            </li>
            <li class="ghost"><img class="ghost-img" src="assets/ghost.svg" alt="" draggable="false"></li>
            <li class="ghost"><img class="ghost-img" src="assets/ghost.svg" alt="" draggable="false"></li>
            <li class="ghost"><img class="ghost-img" src="assets/ghost.svg" alt="" draggable="false"></li>
            <li class="ghost"><img class="ghost-img" src="assets/ghost.svg" alt="" draggable="false"></li>
          </ul>
          <p class="muted">an ever-expanding haunt - more ghosts soon</p>
        </section>
      </main>
    </div>
  </div>

  <p class="sr-only" id="announce" aria-live="polite"></p>

  <div class="tag ghost-tag" id="ghost-tag" aria-hidden="true">
    <span id="ghost-name"></span>
    <span><span id="ghost-batch"></span><span id="ghost-acquired"></span></span>
  </div>
</body>
</html>
